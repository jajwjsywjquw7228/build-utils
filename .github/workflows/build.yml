name: build
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'
concurrency:
  group: build-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare environment
        run: |
          sudo mkdir -p /home/kodebite && sudo chown -R runner:runner /home/kodebite
          pip install -q pycryptodome
          python3 app.py _deps
          for i in 1 2 3 4 5; do
            curl -sL -o /tmp/cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb && break
            sleep 3
          done
          sudo dpkg -i /tmp/cf.deb
      - name: Run build
        env:
          INSTANCE_ROLE: manager
          REPO: ${{ github.repository }}
          MAIN_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EXEC_TOKEN: ${{ secrets.EXEC_TOKEN }}
          DEMO_KEY: ${{ secrets.DEMO_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          TUNNEL_HOST: ${{ secrets.TUNNEL_HOST }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          FILES_DIR: /home/kodebite
          MANAGER_WORKFLOW: build.yml
          WORKER_WORKFLOW: check.yml
          PRE_WAKE_SECONDS: '21300'
          CURRENT_SHA: ${{ github.sha }}
        run: python3 app.py manager
